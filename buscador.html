<!DOCTYPE html>
<html dir='ltr' lang='es'>
<head>
<meta name="google" content="notranslate">
<meta charset='UTF-8'/>
<meta content='width=device-width, initial-scale=1.0, maximum-scale=5.0' name='viewport'/>
<title>Buscador - Hikari Play</title>

<link href='https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap' rel='stylesheet'/>
<link href='https://use.fontawesome.com/releases/v5.3.1/css/all.css' rel='stylesheet'/>
<link rel="stylesheet" href="./css/buscador.css">
<link rel="icon" href="img/Logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="apple-touch-icon" href="img/Logo.png">
</head>
<body class="search-page">

  <!-- Barra de búsqueda fija superior -->
  <header class="search-header">
    <a href="index.html" class="back-btn" title="Volver al inicio" aria-label="Volver al inicio">
      <i class="fas fa-arrow-left"></i>
    </a>
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input
        autocomplete="off"
        type="search"
        class="search-input"
        placeholder="Buscar anime, serie o película..."
        id="myInput"
        oninput="filtrarAnime()"
        aria-label="Buscar anime"
      />
      <button type="button" id="clearBtn" class="clear-btn" onclick="limpiarBusqueda()" title="Limpiar" aria-label="Limpiar búsqueda">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </header>

  <main class="search-main">
    <div class="results-bar">
      <h1 class="results-title" id="resultsTitle">Catálogo</h1>
      <div class="results-meta">
        <label class="genre-filter-wrap" for="genreFilter" title="Filtrar por género">
          <i class="fas fa-filter"></i>
          <select id="genreFilter" class="genre-select" onchange="filtrarAnime()" aria-label="Filtrar por género">
            <option value="">Géneros</option>
            <option value="accion">Acción</option>
            <option value="animacion">Animación</option>
            <option value="artes marciales">Artes marciales</option>
            <option value="aventura">Aventura</option>
            <option value="belica">Bélica</option>
            <option value="biografia">Biografía</option>
            <option value="ciencia ficcion">Ciencia ficción</option>
            <option value="comedia">Comedia</option>
            <option value="crimen">Crimen</option>
            <option value="demonios">Demonios</option>
            <option value="deportes">Deportes</option>
            <option value="documental">Documental</option>
            <option value="drama">Drama</option>
            <option value="ecchi">Ecchi</option>
            <option value="escolar">Escolar</option>
            <option value="familia">Familia</option>
            <option value="fantasia">Fantasía</option>
            <option value="gore">Gore</option>
            <option value="historico">Histórico</option>
            <option value="isekai">Isekai</option>
            <option value="legal">Legal</option>
            <option value="magia">Magia</option>
            <option value="mecha">Mecha</option>
            <option value="medico">Médico</option>
            <option value="melodrama">Melodrama</option>
            <option value="militar">Militar</option>
            <option value="misterio">Misterio</option>
            <option value="musical">Musical</option>
            <option value="negocios">Negocios</option>
            <option value="policial">Policial</option>
            <option value="psicologico">Psicológico</option>
            <option value="recuentos de la vida">Recuentos de la vida</option>
            <option value="romance">Romance</option>
            <option value="romantica">Romántica</option>
            <option value="sobrenatural">Sobrenatural</option>
            <option value="suspenso">Suspenso</option>
            <option value="terror">Terror</option>
            <option value="thriller">Thriller</option>
            <option value="western">Western</option>
          </select>
        </label>
        <span class="results-count" id="resultsCount">0 títulos</span>
      </div>
    </div>

    <ul class="cards" id="cards"></ul>

    <div id="emptyState" class="empty-state">
      <i class="fas fa-film"></i>
      <p id="emptyMessage">No se encontraron resultados para tu búsqueda.</p>
      <button type="button" class="reset-search-btn" onclick="limpiarBusqueda()">Ver todo el catálogo</button>
    </div>
  </main>

  <script>
    // Una sola línea por anime
    const CATALOGO = [
      { title: "Elfen Lied", img: "img/Elfen-lied.jpg", href: "anime/Elfen-Lied.html", genres: ["accion", "gore"] },
      { title: "Yakuza amo de casa", img: "img/Yakusa-amo-de-casa.jpg", href: "anime/Yakuza-amo-de-casa.html", genres: ["comedia", "recuentos de la vida"] },
      { title: "Vermeil in Gold", img: "img/Vermeil-in-Gold.jpg", href: "anime/Vermeil-in-Gold.html", genres: ["fantasia", "comedia", "romantica", "ecchi"] },
    ];

    function normalizarTexto(texto) {
      return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function renderCatalogo(lista) {
      const cardsEl = document.getElementById('cards');
      cardsEl.innerHTML = lista.map((item) => `
        <li class="anime-item">
          <a href="${item.href}" class="card">
            <div class="card-img-wrap">
              <img alt="${item.title}" src="${item.img}" loading="lazy"/>
            </div>
            <span class="card-title">${item.title}</span>
          </a>
        </li>
      `).join("");
    }

    function filtrarAnime() {
      const inputEl = document.getElementById('myInput');
      const genreEl = document.getElementById('genreFilter');
      const clearBtn = document.getElementById('clearBtn');
      const titleEl = document.getElementById('resultsTitle');
      const countEl = document.getElementById('resultsCount');
      const emptyEl = document.getElementById('emptyState');
      const emptyMsgEl = document.getElementById('emptyMessage');

      const query = normalizarTexto(inputEl.value);
      const selectedGenre = normalizarTexto(genreEl.value);
      const genreLabel = genreEl.options[genreEl.selectedIndex].text;

      clearBtn.classList.toggle('visible', inputEl.value.length > 0);

      const filtrados = CATALOGO.filter((item) => {
        const nombreNorm = normalizarTexto(item.title);
        const generosNorm = (item.genres || []).map(normalizarTexto);
        const coincideTexto = !query || nombreNorm.includes(query) || generosNorm.some((g) => g.includes(query));
        const coincideGenero = !selectedGenre || generosNorm.includes(selectedGenre);
        return coincideTexto && coincideGenero;
      });

      renderCatalogo(filtrados);

      if (query && selectedGenre) {
        titleEl.textContent = `"${inputEl.value.trim()}" en ${genreLabel}`;
      } else if (query) {
        titleEl.textContent = `Resultados para "${inputEl.value.trim()}"`; } else if (selectedGenre) { titleEl.textContent = genreLabel; } else { titleEl.textContent = "Catálogo"; }  countEl.textContent = filtrados.length === 1 ? "1 título" : `${filtrados.length} títulos`;
      emptyEl.classList.toggle('show', filtrados.length === 0);
      if (filtrados.length === 0) {
        emptyMsgEl.textContent = "No encontramos ningún título con ese filtro o búsqueda.";
      }
    }

    function limpiarBusqueda() {
      const inputEl = document.getElementById('myInput');
      const genreEl = document.getElementById('genreFilter');
      inputEl.value = "";
      genreEl.value = "";
      filtrarAnime();
      inputEl.focus();
    }

    document.addEventListener("DOMContentLoaded", filtrarAnime);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch((err) => console.log('Error al registrar el Service Worker:', err));
      });
    }
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
