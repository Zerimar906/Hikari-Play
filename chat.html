<script>
  const ONE_HOUR_MS = 60 * 60 * 1000;
  const QUICK_EMOJIS = [
    '😀', '🤣', '😅', '😊', '😍', '😗', '😚', '🤗', '🫡', '😑', '😶‍🌫️', '🤐', '😫', '😜', '😒', '😕', '🫠', '☹️', '😞', '😢',
    '😧', '🤯', '😰', '🥶', '🤪', '🥴', '🤬', '🤕', '🤧', '🥸', '🤠', '🫨', '🤫', '🫣', '😈', '👺', '👻', '🤖', '😸', '😼', '😿', '🙉', '🐶',
    '🦁', '🦊', '🐷', '🐹', '🐻‍❄️', '🐸', '🐔', '🐾', '🦧', '🐩', '🐈‍⬛', '🐎', '🦏', '🐃', '🐏', '🐪', '🦘', '🦡', '🐁', '🐇', '🦎', '🦖', '🐬'
  ];
  const PRIVATE_STICKERS = ['😘', '😉', '💋', '🙈', '🥰', '😏', '💖', '🔥', '💘', '😻', '🥂', '🌹'];

  const PRIVATE_GIFS = [
    { id: "wink", label: "Guiño", url: "https://media.giphy.com/media/13CoXDiaCcCoyk/giphy.gif" },
    { id: "hearts", label: "Corazones", url: "https://media.giphy.com/media/l0amJzVHIAfl7jMDOS/giphy.gif" },
    { id: "fire", label: "Fuego", url: "https://media.giphy.com/media/3o72FfM5HJydZafgUE/giphy.gif" },
    { id: "laugh", label: "Risa", url: "https://media.giphy.com/media/10JhviFuU2gWD6/giphy.gif" },
    { id: "party", label: "Brindis", url: "https://media.giphy.com/media/g9582DNuQppxC/giphy.gif" },
    { id: "shock", label: "Sorpresa", url: "https://media.giphy.com/media/5VKbvrjxpVJCM/giphy.gif" }
  ];

  const demoProfiles = {
    "sakura_chan": {
      fullname: "Sakura",
      username: "sakura_chan",
      avatar: "img/Logo.png",
      banner: "img/Logo.png",
      bio: "Recomendando animes y dramas todos los días.",
      tags: ["Anime", "Música"]
    },
    "kenji_kun": {
      fullname: "Kenji",
      username: "kenji_kun",
      avatar: "img/Logo.png",
      banner: "img/Logo.png",
      bio: "Buscando qué ver esta noche 🍿",
      tags: ["Series", "Videojuegos"]
    }
  };

  const defaultMessages = [
    {
      id: 1,
      userKey: "sakura_chan",
      fullname: "Sakura",
      username: "sakura_chan",
      avatar: "img/Logo.png",
      text: "¡Hola a todos! ¿Qué serie están viendo hoy? 🍿✨",
      time: "19:10",
      isOwn: false
    },
    {
      id: 2,
      userKey: "kenji_kun",
      fullname: "Kenji",
      username: "kenji_kun",
      avatar: "img/Logo.png",
      text: "Yo voy por el capítulo 4 de Estamos muertos 🔥",
      time: "19:12",
      isOwn: false
    }
  ];

  let activeModalUserKey = null;
  let activePrivateUserKey = null;
  let activePickerTab = 'emojis';
  let isPickerOpen = false;
  let moderationInterval = null;

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[tag]));
  }

  function containsURL(text) {
    const urlRegex = /(https?:\/\/|www\.|ftp:\/\/|[a-z0-9-]+\.(com|net|org|io|gg|me|ly|to|xyz|info|biz|co|app|dev|tv|site|online|store|link|click|tk|ml|ga|cf|gq)(\/|\s|$|[?#]))/i;
    return urlRegex.test(text);
  }

  function getModerationState() {
    const raw = JSON.parse(localStorage.getItem("hikariGlobalMod") || '{"warnings":0,"mutedUntil":0}');
    if (raw.mutedUntil && Date.now() >= raw.mutedUntil) {
      raw.mutedUntil = 0;
      raw.warnings = 0;
      localStorage.setItem("hikariGlobalMod", JSON.stringify(raw));
    }
    return raw;
  }

  function saveModerationState(state) {
    localStorage.setItem("hikariGlobalMod", JSON.stringify(state));
  }

  function formatRemainingTime(ms) {
    const totalSec = Math.max(1, Math.ceil(ms / 1000));
    const mins = Math.floor(totalSec / 60);
    const secs = totalSec % 60;
    return `${mins}m ${secs.toString().padStart(2, '0')}s`;
  }

  function updateModerationUI(customAlertMsg = null) {
    const banner = document.getElementById("modAlertBanner");
    const input = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const pickerToggleBtn = document.getElementById("waPickerToggleBtn");
    const mod = getModerationState();
    const isGlobalMuted = !activePrivateUserKey && mod.mutedUntil && Date.now() < mod.mutedUntil;

    if (isGlobalMuted) {
      const rem = formatRemainingTime(mod.mutedUntil - Date.now());
      banner.textContent = `Estás silenciado en el Chat Global por enviar enlaces 2 veces. Tiempo restante: ${rem}.`;
      banner.classList.add("show");
      input.disabled = true;
      sendBtn.disabled = true;
      pickerToggleBtn.disabled = true;
      closeWaPicker();
    } else {
      input.disabled = false;
      sendBtn.disabled = false;
      pickerToggleBtn.disabled = false;

      if (customAlertMsg) {
        banner.textContent = customAlertMsg;
        banner.classList.add("show");
      } else {
        banner.textContent = "";
        banner.classList.remove("show");
      }
    }
  }

  function registerUrlViolation() {
    if (activePrivateUserKey) {
      updateModerationUI("No está permitido enviar enlaces (URLs) en ningún chat.");
      return;
    }

    const mod = getModerationState();
    mod.warnings = (mod.warnings || 0) + 1;

    if (mod.warnings >= 2) {
      mod.mutedUntil = Date.now() + ONE_HOUR_MS;
      mod.warnings = 0;
      saveModerationState(mod);
      updateModerationUI();
    } else {
      saveModerationState(mod);
      updateModerationUI("No se permiten URLs en ningún chat. Advertencia 1/2: a la 2.ª vez serás silenciado 1 hora en el Chat Global.");
    }
  }

  function renderWaPickerContent() {
    const grid = document.getElementById("waPickerGrid");
    const tabEmojis = document.getElementById("tabEmojisBtn");
    const tabStickers = document.getElementById("tabStickersBtn");
    const tabGifs = document.getElementById("tabGifsBtn");

    tabEmojis.classList.toggle("active", activePickerTab === "emojis");
    tabStickers.classList.toggle("active", activePickerTab === "stickers");
    tabGifs.classList.toggle("active", activePickerTab === "gifs");
    grid.classList.toggle("gifs-mode", activePickerTab === "gifs" && Boolean(activePrivateUserKey));

    if (activePickerTab === "stickers") {
      if (!activePrivateUserKey) {
        grid.innerHTML = `<div class="wa-locked-note">Los stickers solo están disponibles en chats privados.</div>`;
        return;
      }
      grid.innerHTML = PRIVATE_STICKERS.map(st => `
        <button type="button" class="wa-item-btn wa-sticker-item" onclick="sendPrivateSticker('${st}')">${st}</button>
      `).join('');
      return;
    }

    if (activePickerTab === "gifs") {
      if (!activePrivateUserKey) {
        grid.innerHTML = `<div class="wa-locked-note">Los GIFs solo están disponibles en chats privados.</div>`;
        return;
      }
      grid.innerHTML = PRIVATE_GIFS.map(g => `
        <button type="button" class="wa-gif-btn" onclick="sendPrivateGif('${g.id}')">
          <img src="${g.url}" alt="${escapeHTML(g.label)}" loading="lazy">
          <span>${escapeHTML(g.label)}</span>
        </button>
      `).join('');
      return;
    }

    grid.innerHTML = QUICK_EMOJIS.map(em => `
      <button type="button" class="wa-item-btn" onclick="addEmoji('${em}')">${em}</button>
    `).join('');
  }

  function toggleWaPicker() {
    const mod = getModerationState();
    if (!activePrivateUserKey && mod.mutedUntil && Date.now() < mod.mutedUntil) return;

    isPickerOpen = !isPickerOpen;
    const popover = document.getElementById("waPickerPopover");
    const toggleBtn = document.getElementById("waPickerToggleBtn");
    popover.classList.toggle("show", isPickerOpen);
    toggleBtn.classList.toggle("active", isPickerOpen);
    if (isPickerOpen) {
      renderWaPickerContent();
    }
  }

  function closeWaPicker() {
    isPickerOpen = false;
    document.getElementById("waPickerPopover").classList.remove("show");
    document.getElementById("waPickerToggleBtn").classList.remove("active");
  }

  function switchPickerTab(tabName) {
    activePickerTab = tabName;
    renderWaPickerContent();
  }

  function getCurrentTimeStr() {
    const now = new Date();
    return now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
  }

  function getStoredGlobalMessages() {
    const saved = localStorage.getItem("hikariGlobalChat");
    return saved ? JSON.parse(saved) : defaultMessages;
  }

  function getStoredPrivateMessages(userKey) {
    const allDMs = JSON.parse(localStorage.getItem("hikariPrivateChats") || "{}");
    return allDMs[userKey] || [];
  }

  function savePrivateMessage(userKey, msg) {
    const allDMs = JSON.parse(localStorage.getItem("hikariPrivateChats") || "{}");
    if (!allDMs[userKey]) allDMs[userKey] = [];
    allDMs[userKey].push(msg);
    localStorage.setItem("hikariPrivateChats", JSON.stringify(allDMs));
  }

  function getUserProfileData(userKey) {
    if (demoProfiles[userKey]) {
      return demoProfiles[userKey];
    }
    let parsedTags = ["Anime"];
    try {
      const rawLikes = JSON.parse(localStorage.getItem("hikariLikes") || '["Anime"]');
      if (Array.isArray(rawLikes) && rawLikes.length) parsedTags = rawLikes;
    } catch (_) {}

    return {
      fullname: localStorage.getItem("hikariFullname") || "Usuario Hikari",
      username: localStorage.getItem("hikariUsername") || "usuario",
      avatar: localStorage.getItem("hikariAvatar") || "img/Logo.png",
      banner: localStorage.getItem("hikariBanner") || localStorage.getItem("hikariAvatar") || "img/Logo.png",
      bio: localStorage.getItem("hikariBio") || "Explorando Hikari Play.",
      tags: parsedTags
    };
  }

  function renderFriendsBar() {
    const bar = document.getElementById("friendsBar");
    const friends = JSON.parse(localStorage.getItem("hikariFriendUsers") || "[]");

    if (!friends.length) {
      bar.innerHTML = `<span class="friends-empty-hint">Agrega amigos desde su perfil para verlos aquí y hablar al privado.</span>`;
      return;
    }

    bar.innerHTML = friends.map(userKey => {
      const u = getUserProfileData(userKey);
      const isSelected = activePrivateUserKey === userKey;
      return `
        <button type="button" class="friend-chip ${isSelected ? 'active-dm' : ''}" onclick="openPrivateChatWith('${userKey}')">
          <img src="${u.avatar}" alt="${escapeHTML(u.fullname)}">
          <span>${escapeHTML(u.fullname)}</span>
        </button>
      `;
    }).join('');
  }

  function updateRoomHeader() {
    const titleEl = document.getElementById("roomTitleText");
    const iconEl = document.getElementById("roomIcon");
    const backBtn = document.getElementById("backToGlobalBtn");
    const ribbonTextEl = document.getElementById("chatRulesText");
    const inputEl = document.getElementById("chatInput");
    const photoBtn = document.getElementById("privatePhotoBtn");

    if (activePrivateUserKey) {
      const peer = getUserProfileData(activePrivateUserKey);
      titleEl.textContent = `Privado · ${peer.fullname}`;
      iconEl.className = "fas fa-paper-plane";
      backBtn.style.display = "inline-flex";
      ribbonTextEl.textContent = `Chat privado con ${peer.fullname} (@${peer.username}): fotos, GIFs y stickers permitidos · Prohibido enviar URLs.`;
      inputEl.placeholder = `Mensaje privado para ${peer.fullname}...`;
      photoBtn.classList.add("show");
    } else {
      titleEl.textContent = "Chat Global";
      iconEl.className = "fas fa-comments";
      backBtn.style.display = "none";
      ribbonTextEl.textContent = "Sala Global de Hikari Play: solo texto y emojis. Prohibido enviar URLs (2 faltas = 1 hora sin hablar).";
      inputEl.placeholder = "Escribe un mensaje o emoji...";
      photoBtn.classList.remove("show");
      if (activePickerTab === "stickers" || activePickerTab === "gifs") {
        activePickerTab = "emojis";
      }
    }

    if (isPickerOpen) {
      renderWaPickerContent();
    }
  }

  function renderMessageContent(m) {
    if (m.type === "photo" && m.photoData) {
      return `<img src="${m.photoData}" class="msg-photo" alt="Foto enviada">`;
    }
    if (m.type === "sticker" && m.sticker) {
      return `<span class="msg-sticker">${escapeHTML(m.sticker)}</span>`;
    }
    if (m.type === "gif" && m.gifId) {
      const gifObj = PRIVATE_GIFS.find(item => item.id === m.gifId);
      if (gifObj) {
        return `<img src="${gifObj.url}" class="msg-gif" alt="${escapeHTML(gifObj.label)}">`;
      }
    }
    return `<div class="msg-text">${escapeHTML(m.text || "")}</div>`;
  }

  function renderMessages() {
    const area = document.getElementById("messagesArea");
    updateRoomHeader();
    renderFriendsBar();
    updateModerationUI();

    const list = activePrivateUserKey
      ? getStoredPrivateMessages(activePrivateUserKey)
      : getStoredGlobalMessages();

    area.innerHTML = list.map(m => `
      <div class="msg-row ${m.isOwn ? 'own' : ''}">
        <img src="${m.avatar}" class="msg-avatar" alt="Avatar" onclick="openUserCard('${m.userKey}')">
        <div class="msg-bubble">
          <div class="msg-meta">
            <span class="msg-author" onclick="mentionUser('${escapeHTML(m.username)}')">${escapeHTML(m.fullname)}</span>
            <span class="msg-time">${m.time}</span>
          </div>
          ${renderMessageContent(m)}
        </div>
      </div>
    `).join('');

    area.scrollTop = area.scrollHeight;
  }

  function mentionUser(username) {
    const input = document.getElementById("chatInput");
    if (input.disabled) return;
    const mentionText = `@${username} `;
    if (!input.value.includes(mentionText)) {
      input.value = input.value ? `${input.value.trimEnd()} ${mentionText}` : mentionText;
    }
    input.focus();
  }

  function addEmoji(emoji) {
    const input = document.getElementById("chatInput");
    if (input.disabled) return;
    input.value += emoji;
    input.focus();
  }

  function buildOwnBaseMsg() {
    return {
      id: Date.now(),
      userKey: "currentUser",
      fullname: localStorage.getItem("hikariFullname") || "Usuario Hikari",
      username: localStorage.getItem("hikariUsername") || "usuario",
      avatar: localStorage.getItem("hikariAvatar") || "img/Logo.png",
      time: getCurrentTimeStr(),
      isOwn: true
    };
  }

  function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById("chatInput");
    if (input.disabled) return;

    const rawText = input.value.trim();
    if (!rawText) return;

    if (containsURL(rawText)) {
      registerUrlViolation();
      return;
    }

    const newMsg = {
      ...buildOwnBaseMsg(),
      type: "text",
      text: rawText
    };

    if (activePrivateUserKey) {
      savePrivateMessage(activePrivateUserKey, newMsg);
    } else {
      const messages = getStoredGlobalMessages();
      messages.push(newMsg);
      localStorage.setItem("hikariGlobalChat", JSON.stringify(messages));
    }

    input.value = "";
    closeWaPicker();
    updateModerationUI();
    renderMessages();
  }

  function sendPrivateSticker(sticker) {
    if (!activePrivateUserKey) return;
    savePrivateMessage(activePrivateUserKey, {
      ...buildOwnBaseMsg(),
      type: "sticker",
      sticker
    });
    closeWaPicker();
    renderMessages();
  }

  function sendPrivateGif(gifId) {
    if (!activePrivateUserKey) return;
    const gifObj = PRIVATE_GIFS.find(item => item.id === gifId);
    if (!gifObj) return;

    savePrivateMessage(activePrivateUserKey, {
      ...buildOwnBaseMsg(),
      type: "gif",
      gifId: gifObj.id
    });
    closeWaPicker();
    renderMessages();
  }

  function handlePrivatePhoto(e) {
    if (!activePrivateUserKey) return;
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      updateModerationUI("Solo se permiten archivos de imagen en el chat privado.");
      e.target.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = function(ev) {
      savePrivateMessage(activePrivateUserKey, {
        ...buildOwnBaseMsg(),
        type: "photo",
        photoData: ev.target.result
      });
      e.target.value = "";
      closeWaPicker();
      renderMessages();
    };
    reader.readAsDataURL(file);
  }

  function openPrivateChatWith(userKey) {
    activePrivateUserKey = userKey;
    renderMessages();
    if (!document.getElementById("chatInput").disabled) {
      document.getElementById("chatInput").focus();
    }
  }

  function openGlobalChat() {
    activePrivateUserKey = null;
    renderMessages();
  }

  function refreshActionButtonsState(userKey) {
    const likes = JSON.parse(localStorage.getItem("hikariLikedUsers") || "[]");
    const friends = JSON.parse(localStorage.getItem("hikariFriendUsers") || "[]");

    const isLiked = likes.includes(userKey);
    const isFriend = friends.includes(userKey);

    const btnLike = document.getElementById("btnLikeUser");
    const labelLike = document.getElementById("labelLikeUser");
    btnLike.classList.toggle("active-like", isLiked);
    labelLike.textContent = isLiked ? "Te gusta" : "Me gusta";

    const btnFriend = document.getElementById("btnFriendUser");
    const labelFriend = document.getElementById("labelFriendUser");
    btnFriend.classList.toggle("active-friend", isFriend);
    labelFriend.textContent = isFriend ? "Amigo" : "Agregar";
  }

  function openUserCard(userKey) {
    activeModalUserKey = userKey;
    const u = getUserProfileData(userKey);

    document.getElementById("miniName").textContent = u.fullname;
    document.getElementById("miniUser").textContent = "@" + u.username;
    document.getElementById("miniAvatar").src = u.avatar;
    document.getElementById("miniBannerImg").src = u.banner || u.avatar;
    document.getElementById("miniBio").textContent = u.bio;
    document.getElementById("miniProfileLink").href =
      userKey === "currentUser"
        ? "perfil.html"
        : `perfil.html?user=${encodeURIComponent(u.username)}`;

    const tagsEl = document.getElementById("miniTags");
    tagsEl.innerHTML = u.tags.length
      ? u.tags.map(t => `<span class="mini-tag">${escapeHTML(t)}</span>`).join('')
      : `<span class="mini-tag">Hikari Play</span>`;

    refreshActionButtonsState(userKey);
    document.getElementById("miniProfileModal").classList.add("show");
  }

  function toggleLikeUser() {
    if (!activeModalUserKey) return;
    let likes = JSON.parse(localStorage.getItem("hikariLikedUsers") || "[]");
    if (likes.includes(activeModalUserKey)) {
      likes = likes.filter(k => k !== activeModalUserKey);
    } else {
      likes.push(activeModalUserKey);
    }
    localStorage.setItem("hikariLikedUsers", JSON.stringify(likes));
    refreshActionButtonsState(activeModalUserKey);
  }

  function toggleFriendUser() {
    if (!activeModalUserKey) return;
    let friends = JSON.parse(localStorage.getItem("hikariFriendUsers") || "[]");
    if (friends.includes(activeModalUserKey)) {
      friends = friends.filter(k => k !== activeModalUserKey);
      if (activePrivateUserKey === activeModalUserKey) {
        activePrivateUserKey = null;
      }
    } else {
      friends.push(activeModalUserKey);
    }
    localStorage.setItem("hikariFriendUsers", JSON.stringify(friends));
    refreshActionButtonsState(activeModalUserKey);
    renderFriendsBar();
    if (!activePrivateUserKey) renderMessages();
  }

  function startPrivateChat() {
    if (!activeModalUserKey) return;
    let friends = JSON.parse(localStorage.getItem("hikariFriendUsers") || "[]");
    if (!friends.includes(activeModalUserKey)) {
      friends.push(activeModalUserKey);
      localStorage.setItem("hikariFriendUsers", JSON.stringify(friends));
    }
    const targetKey = activeModalUserKey;
    closeMiniProfile();
    openPrivateChatWith(targetKey);
  }

  function closeMiniProfile(e) {
    if (!e || e.target.id === "miniProfileModal") {
      document.getElementById("miniProfileModal").classList.remove("show");
    }
  }

  document.addEventListener("click", (e) => {
    const popover = document.getElementById("waPickerPopover");
    const toggleBtn = document.getElementById("waPickerToggleBtn");
    if (isPickerOpen && !popover.contains(e.target) && !toggleBtn.contains(e.target)) {
      closeWaPicker();
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    renderMessages();
    moderationInterval = setInterval(() => {
      updateModerationUI();
    }, 1000);
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/hikari-play/sw.js')
        .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
        .catch((err) => console.log('Error al registrar el Service Worker:', err));
    });
  }
</script>
<script src="js/auth.js"></script>
</body>
</html>
